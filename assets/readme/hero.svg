<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">brainstorm2idea — turn fuzzy ideas into machine-linted prototype briefs</title>
  <desc id="hero-desc">Terminal-style hero showing the b2i command pipeline: check passes 7 of 7 lint checks, score returns 85 out of 100 grade B, and handoff scaffolds via idea2prototype.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="amberbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="420" fill="url(#amberbar)"/>

  <!-- wordmark -->
  <text x="56" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4" fill="#9CA3AF">FUZZY IDEA &#8594; LINTED BRIEF &#8594; RUNNING PROTOTYPE</text>
  <text x="52" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#F9FAFB">brainstorm2idea</text>
  <text x="520" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#F59E0B">b2i</text>

  <text x="56" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#D1D5DB">The pre-stage of idea2prototype: a token-budgeted</text>
  <text x="56" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#D1D5DB">dialogue turns raw thought into a linted brief, scores</text>
  <text x="56" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#D1D5DB">it for doability, then hands off deterministically.</text>

  <!-- metadata chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="56" y="300" width="140" height="34" rx="17" fill="#1F2937" stroke="#374151"/>
    <text x="126" y="322" text-anchor="middle" fill="#34D399">zero deps</text>
    <rect x="210" y="300" width="160" height="34" rx="17" fill="#1F2937" stroke="#374151"/>
    <text x="290" y="322" text-anchor="middle" fill="#9CA3AF">node &#8805; 18.17</text>
    <rect x="384" y="300" width="200" height="34" rx="17" fill="#1F2937" stroke="#374151"/>
    <text x="484" y="322" text-anchor="middle" fill="#9CA3AF">schema b2i-brief@1</text>
  </g>

  <!-- bottom caption -->
  <text x="56" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B7280">$ npx @ahmed-3m/brainstorm2idea init my-idea</text>

  <!-- terminal panel -->
  <g>
    <rect x="700" y="40" width="452" height="340" rx="12" fill="#0B0F14" stroke="#374151"/>
    <circle cx="726" cy="64" r="5" fill="#EF4444"/>
    <circle cx="744" cy="64" r="5" fill="#F59E0B"/>
    <circle cx="762" cy="64" r="5" fill="#34D399"/>
    <text x="926" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6B7280">b2i — brief.md</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <text x="722" y="112" fill="#F59E0B">$<tspan fill="#F9FAFB"> b2i check brief.md</tspan></text>
      <text x="722" y="142" fill="#34D399">&#10003; PASS (7/7)</text>

      <text x="722" y="186" fill="#F59E0B">$<tspan fill="#F9FAFB"> b2i score brief.md</tspan></text>
      <text x="722" y="216" fill="#F9FAFB">85/100 (Grade B - GOOD)</text>
      <text x="722" y="244" fill="#9CA3AF" font-size="16">&#10003; OAuth/SSO mitigated in Out of scope</text>

      <text x="722" y="288" fill="#F59E0B">$<tspan fill="#F9FAFB"> b2i handoff my-app</tspan></text>
      <text x="722" y="318" fill="#34D399">&#10003; scaffolded via idea2prototype</text>
      <rect x="722" y="336" width="12" height="22" fill="#F59E0B"/>
    </g>
  </g>
</svg>
