name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — catches idea2prototype drift between b2i releases

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Engine tests + consistency checks + benchmarks
        run: npm test

  package-smoke:
    # Verifies the published tarball is actually installable and runnable.
    # A missing entry in package.json "files" breaks `npx @ahmed-3m/brainstorm2idea`
    # without breaking any in-repo test, so it needs its own check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pack the tarball
        id: pack
        run: echo "tarball=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install the packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm install "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}"

      - name: Run the installed binary
        run: |
          cd "$RUNNER_TEMP/smoke"
          BIN="node_modules/@ahmed-3m/brainstorm2idea/bin/b2i.mjs"
          test -f "$BIN"
          test "$(node "$BIN" --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          node "$BIN" list

      - name: Run the npm-linked bin (the path npx and global installs use)
        # npm links bins as bare symlinks on POSIX (`.bin/b2i` -> bin/b2i.mjs).
        # v0.4.2 shipped a bin that silently exited 0 through that symlink.
        run: |
          cd "$RUNNER_TEMP/smoke"
          test "$(node_modules/.bin/b2i --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          printf 'garbage\n' > garbage.md
          if node_modules/.bin/b2i check garbage.md; then echo "b2i check must fail on a garbage brief"; exit 1; fi

      - name: Lint a brief through the installed binary
        run: |
          cd "$RUNNER_TEMP/smoke"
          printf '%s\n' \
            '---' \
            'schema: b2i-brief@1' \
            'template: cli' \
            'distilled: Smoke test brief from the packed tarball' \
            '---' \
            '# Smoke' \
            '' \
            '## Goal' \
            '- Verify the tarball ships a working engine' \
            '' \
            '## Core flows' \
            '1. Run b2i check from the packed tarball' \
            '' \
            '## Out of scope' \
            '- Nothing' \
            | node node_modules/@ahmed-3m/brainstorm2idea/bin/b2i.mjs check -

      - name: Verify the tarball ships the parser module
        # brainstorm2idea.mjs imports ./parser.mjs relatively — a missing file
        # in the "files" array would break the engine at import time.
        run: |
          test -f "$RUNNER_TEMP/smoke/node_modules/@ahmed-3m/brainstorm2idea/skills/brainstorm2idea/scripts/parser.mjs"
          test -f "$RUNNER_TEMP/smoke/node_modules/@ahmed-3m/brainstorm2idea/skills/brainstorm2idea/SKILL.md"

  i2p-contract:
    # Cross-repo contract guard: feeds REAL `b2i handoff` output into the
    # PUBLISHED @ahmed-3m/idea2prototype (npx @latest — the exact default
    # users get). If i2p changes its CLI flags, exit codes, or stops writing
    # PROTOTYPE.md, this job fails here instead of in a user's terminal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Seed a real brief with the engine
        run: |
          node bin/b2i.mjs spark --seed env-diff --output "$RUNNER_TEMP/brief.md"
          node bin/b2i.mjs check "$RUNNER_TEMP/brief.md"

      - name: Hand off to the published idea2prototype
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/bin/b2i.mjs" handoff contract-demo --brief brief.md

      - name: Verify the merged PROTOTYPE.md contract
        run: |
          P="$RUNNER_TEMP/contract-demo/PROTOTYPE.md"
          test -f "$P"
          grep -q '^## Goal' "$P"
          grep -q '^## Out of scope' "$P"
          grep -q 'Compare local .env against repository .env.example' "$P"
          test ! -f "$RUNNER_TEMP/brief.md"  # brief is consumed only on verified success
