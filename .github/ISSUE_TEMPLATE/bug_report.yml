name: Bug report
description: Report something that isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! `b2i` is deterministic — a version, a command, and
        (for brief problems) the brief file are usually enough to reproduce.
        Check you're on the latest release first: `npx @ahmed-3m/brainstorm2idea --version`.
  - type: input
    id: b2i-version
    attributes:
      label: b2i version
      description: Output of `b2i --version`.
      placeholder: "0.4.1"
    validations:
      required: true
  - type: dropdown
    id: node-version
    attributes:
      label: Node.js version
      options:
        - "18"
        - "20"
        - "22"
        - "24"
        - Other (mention it below)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact invocation, including flags and whether input came from stdin.
      placeholder: npx @ahmed-3m/brainstorm2idea check brief.md --fix
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Paste the full terminal output, including the verdict and any notes.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: brief
    attributes:
      label: The brief (if check / score / handoff related)
      description: The engine is file-driven — pasting the full `brief.md` is usually enough to reproduce locally.
      render: markdown
