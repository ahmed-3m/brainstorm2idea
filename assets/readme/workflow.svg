<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">brainstorm2idea pipeline</title>
  <desc id="wf-desc">Five stage pipeline: fuzzy idea, brief dot md, check and score, handoff, running prototype.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="260" fill="#0D1117"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- stage 1 -->
    <rect x="40" y="70" width="190" height="110" rx="12" fill="#111827" stroke="#374151"/>
    <text x="135" y="112" text-anchor="middle" font-size="20" fill="#F9FAFB">fuzzy idea</text>
    <text x="135" y="140" text-anchor="middle" font-size="14" fill="#9CA3AF">chat dump &#183; notes</text>
    <text x="135" y="160" text-anchor="middle" font-size="14" fill="#9CA3AF">voice transcript</text>

    <line x1="230" y1="125" x2="262" y2="125" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- stage 2 --><!-- fixed -->
    <rect x="268" y="70" width="190" height="110" rx="12" fill="#111827" stroke="#F59E0B" stroke-opacity="0.6"/>
    <text x="363" y="112" text-anchor="middle" font-size="20" fill="#F59E0B">brief.md</text>
    <text x="363" y="140" text-anchor="middle" font-size="14" fill="#9CA3AF">schema b2i-brief@1</text>
    <text x="363" y="160" text-anchor="middle" font-size="14" fill="#9CA3AF">Socratic dialogue</text>

    <line x1="458" y1="125" x2="490" y2="125" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- stage 3 -->
    <rect x="496" y="70" width="190" height="110" rx="12" fill="#111827" stroke="#374151"/>
    <text x="591" y="105" text-anchor="middle" font-size="19" fill="#F9FAFB">check &#183; score</text>
    <text x="591" y="133" text-anchor="middle" font-size="14" fill="#34D399">7 hard lint checks</text>
    <text x="591" y="153" text-anchor="middle" font-size="14" fill="#9CA3AF">doability 0&#8211;100</text>

    <line x1="686" y1="125" x2="718" y2="125" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- stage 4 -->
    <rect x="724" y="70" width="190" height="110" rx="12" fill="#111827" stroke="#374151"/>
    <text x="819" y="112" text-anchor="middle" font-size="20" fill="#F9FAFB">handoff</text>
    <text x="819" y="140" text-anchor="middle" font-size="14" fill="#9CA3AF">--target i2p</text>
    <text x="819" y="160" text-anchor="middle" font-size="14" fill="#9CA3AF">--target raw</text>

    <line x1="914" y1="125" x2="946" y2="125" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- stage 5 -->
    <rect x="952" y="70" width="208" height="110" rx="12" fill="#111827" stroke="#34D399" stroke-opacity="0.6"/>
    <text x="1056" y="112" text-anchor="middle" font-size="20" fill="#34D399">prototype</text>
    <text x="1056" y="140" text-anchor="middle" font-size="14" fill="#9CA3AF">idea2prototype or</text>
    <text x="1056" y="160" text-anchor="middle" font-size="14" fill="#9CA3AF">standalone workspace</text>
  </g>

  <text x="600" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B7280">one command per stage &#183; the brief is deleted only after a verified handoff</text>
</svg>
