<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Terminal demo: b2i init, fill the brief, b2i check PASS 7/7, b2i score 100/100 Grade A, b2i handoff scaffolds plant-pulse/PROTOTYPE.md">
<title>b2i: fuzzy idea to running prototype in four commands</title>
<rect x="1" y="1" width="1198" height="662" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<line x1="1" y1="42" x2="1199" y2="42" stroke="#30363d" stroke-width="1"/>
<circle cx="24" cy="21" r="6" fill="#ff5f56"/>
<circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
<circle cx="68" cy="21" r="6" fill="#27c93f"/>
<text x="600" y="25.5" text-anchor="middle" font-size="12" fill="#8b949e">b2i — fuzzy idea → brief.md → running prototype</text>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0136;0.0216;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="86" font-size="12.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> b2i init plant-pulse --template web</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0500;0.0580;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="102" font-size="12.5"><tspan fill="#8b949e">Brainstorm2idea init — </tspan><tspan fill="#3fb950">SUCCESS</tspan></text>
<text x="28" y="118" font-size="12.5"><tspan fill="#8b949e">  brief:    brief.md</tspan></text>
<text x="28" y="134" font-size="12.5"><tspan fill="#8b949e">  template: </tspan><tspan fill="#39c5cf">web</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1455;0.1534;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="166" font-size="12.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> $EDITOR brief.md</tspan><tspan fill="#8b949e">   # fill in the TODO sections</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1864;0.1943;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="182" font-size="12.5"><tspan fill="#8b949e">---</tspan></text>
<text x="28" y="198" font-size="12.5"><tspan fill="#8b949e">schema: b2i-brief@1   template: web</tspan></text>
<text x="28" y="214" font-size="12.5"><tspan fill="#8b949e">distilled: &quot;Lightweight shared plant watering tracker …&quot;</tspan></text>
<text x="28" y="230" font-size="12.5"><tspan fill="#8b949e">---</tspan></text>
<text x="28" y="246" font-size="12.5"><tspan fill="#e6edf3"># PlantPulse</tspan></text>
<text x="28" y="262" font-size="12.5"><tspan fill="#8b949e">(sections: Goal · Core flows · Out of scope · Risks &amp; assumptions)</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3409;0.3489;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="294" font-size="12.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> b2i check</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3818;0.3898;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="310" font-size="12.5"><tspan fill="#8b949e">Brainstorm2idea check — </tspan><tspan fill="#3fb950">PASS</tspan><tspan fill="#8b949e"> (7/7)</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4773;0.4852;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="342" font-size="12.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> b2i score</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5182;0.5261;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="358" font-size="12.5"><tspan fill="#8b949e">Brainstorm2idea score — </tspan><tspan fill="#3fb950">100/100</tspan><tspan fill="#8b949e"> (</tspan><tspan fill="#3fb950">Grade A - EXCELLENT</tspan><tspan fill="#8b949e">)</tspan></text>
<text x="28" y="374" font-size="12.5"><tspan fill="#8b949e">  breakdown: scope=30/30, infra=40/40, alignment=30/30</tspan></text>
<text x="28" y="390" font-size="12.5"><tspan fill="#3fb950">  ✓ Mitigated OAuth/SSO: explicitly marked in Out of scope</tspan></text>
<text x="28" y="406" font-size="12.5"><tspan fill="#3fb950">  ✓ Mitigated Payment gateway: explicitly marked in Out of scope</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6705;0.6784;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="438" font-size="12.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> b2i handoff plant-pulse --target raw</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7091;0.7170;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="454" font-size="12.5"><tspan fill="#8b949e">Brainstorm2idea handoff — </tspan><tspan fill="#3fb950">SUCCESS</tspan><tspan fill="#8b949e"> (raw target)</tspan></text>
<text x="28" y="470" font-size="12.5"><tspan fill="#8b949e">  project: plant-pulse (web template)</tspan></text>
<text x="28" y="486" font-size="12.5"><tspan fill="#8b949e">  spec:    plant-pulse/PROTOTYPE.md (source brief moved)</tspan></text>
<text x="28" y="502" font-size="12.5"><tspan fill="#8b949e">Next steps:</tspan></text>
<text x="28" y="518" font-size="12.5"><tspan fill="#8b949e">  cd plant-pulse</tspan></text>
<text x="28" y="534" font-size="12.5"><tspan fill="#8b949e">  Implement flows according to plant-pulse/PROTOTYPE.md</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8750;0.8830;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="566" font-size="12.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> head -3 plant-pulse/PROTOTYPE.md</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9136;0.9216;1" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="582" font-size="12.5"><tspan fill="#39c5cf"># Prototype spec — PlantPulse</tspan></text>
<text x="28" y="598" font-size="12.5"><tspan fill="#8b949e">&gt; Idea: Lightweight shared plant watering tracker showing days until next water</tspan></text>
<text x="28" y="614" font-size="12.5"><tspan fill="#8b949e">&gt; Goal: track watering dates, one-tap &quot;watered&quot;, add plants</tspan></text>
</g>
<g>
<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.06s" calcMode="discrete" repeatCount="indefinite"/>
<rect x="29" y="74.5" width="8" height="14.5" fill="#e6edf3">
<animate attributeName="y" values="86.0;102.0;150.0;182.0;278.0;310.0;326.0;358.0;422.0;454.0;550.0;582.0;630.0;630.0" keyTimes="0.0000;0.0136;0.0500;0.1455;0.1864;0.3409;0.3818;0.4773;0.5182;0.6705;0.7091;0.8750;0.9136;1.0000" dur="44s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
</g>
</svg>
